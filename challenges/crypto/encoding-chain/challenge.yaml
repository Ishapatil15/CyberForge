name: Encoding Chain
slug: encoding-chain
category: CRYPTOGRAPHY
difficulty: EASY
points: 120
description: |
  An attacker obfuscated their payload by chaining multiple encoding layers.
  Unwrap the encoding transformations in sequence to discover the plaintext flag.
tags:
